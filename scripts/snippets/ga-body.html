<!-- Einwilligungs-Banner (gleicher Key pl_consent wie die App) + CTA-Klick-Messung -->
<div id="pl-consent" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:520px;margin:0 auto;background:#0f1d33;color:#cbd5e1;border:1px solid #334155;border-radius:14px;padding:14px 16px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4)">
  <div style="margin-bottom:10px">Wir nutzen Google Analytics nur mit deiner Einwilligung, um PLAN zu verbessern. <a href="/datenschutz.html" style="color:#38bdf8">Datenschutz</a></div>
  <div style="display:flex;gap:8px">
    <button id="pl-consent-yes" style="flex:1;background:#0284c7;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">Akzeptieren</button>
    <button id="pl-consent-no" style="flex:1;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:10px;font-weight:600;cursor:pointer">Ablehnen</button>
  </div>
</div>
<script>
(function(){
  function set(v){ try{localStorage.setItem('pl_consent',v);}catch(e){} if(v==='granted'&&typeof gtag==='function') gtag('consent','update',{'analytics_storage':'granted'}); var b=document.getElementById('pl-consent'); if(b) b.style.display='none'; }
  var c=null; try{ c=localStorage.getItem('pl_consent'); }catch(e){}
  var y=document.getElementById('pl-consent-yes'), n=document.getElementById('pl-consent-no');
  if(y) y.onclick=function(){set('granted');}; if(n) n.onclick=function(){set('denied');};
  window.plOpenConsent=function(){ var b=document.getElementById('pl-consent'); if(b) b.style.display='block'; };
  if(!c) window.plOpenConsent();
  // Klicks Richtung App / Play Store messen
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a) return;
    var h=a.getAttribute('href')||''; if(!/plan-nrw\.de\/?(\?|$)|^\/?\?|play\.google|^\/$/.test(h)) return;
    try{ if(typeof gtag==='function') gtag('event','cta_click',{seite:location.pathname,ziel:h.slice(0,100),transport_type:'beacon'}); }catch(err){}
  },true);
})();
</script>
