<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PflegeLearn NRW – Links</title>
<meta name="description" content="KI-Lernassistent für die Pflegeausbildung in NRW. Quiz, Pflegeplanung, Krankheitsbilder, Taschenkarten.">
<link rel="icon" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap');

:root{
  --navy:#0b1a35;
  --blue:#1e4080;
  --sky:#38bdf8;
  --text:#ddf0fb;
  --muted:#6f97b4;
  --card:rgba(13,33,53,.85);
  --border:rgba(56,189,248,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:48px 22px 28px;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 55% at 100% 0%, rgba(30,64,128,.55) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 0% 100%, rgba(3,105,161,.28) 0%, transparent 60%),
    repeating-linear-gradient(45deg, transparent, transparent 60px, rgba(255,255,255,.01) 60px, rgba(255,255,255,.01) 61px);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;text-align:center;}

.logo{
  width:96px;height:96px;border-radius:24px;
  margin:0 auto 20px;display:block;
  box-shadow:0 8px 30px rgba(56,189,248,.25);
  border:1px solid var(--border);
}
h1{font-size:25px;font-weight:900;letter-spacing:-.5px;}
.tag{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.5;}

.links{display:flex;flex-direction:column;gap:14px;margin-top:34px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;font-size:16px;font-weight:700;
  padding:17px 20px;border-radius:15px;
  transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
}
.btn:active{transform:scale(.975);}
.btn svg{width:20px;height:20px;flex:none;}

.btn.primary{
  background:linear-gradient(135deg,var(--sky),#0ea5e9);
  color:#04121f;
  box-shadow:0 6px 22px rgba(56,189,248,.35);
}
.btn.ghost{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
}
.sub{
  display:block;font-size:12px;font-weight:500;color:#04121f;
  opacity:.75;margin-top:2px;
}

footer{
  position:relative;z-index:1;
  margin-top:38px;font-size:12px;color:var(--muted);
}
footer a{color:var(--muted);text-decoration:none;}
footer a:active{color:var(--sky);}
</style>
</head>
<body>

  <div class="wrap">
    <img src="icon-512.png" alt="PflegeLearn NRW Logo" class="logo">
    <h1>PflegeLearn NRW</h1>
    <p class="tag">Dein KI-Lernassistent für die<br>Pflegeausbildung in NRW</p>

    <div class="links">

      <a href="https://pflegelearn-nrw.vercel.app" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        <span>App öffnen<span class="sub">7 Tage kostenlos testen</span></span>
      </a>

      <a href="https://pflegelearn-nrw.vercel.app/landingpage.html" class="btn ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        Mehr erfahren
      </a>

      <!-- Play Store: einblenden, sobald der Store-Link nach dem Review da ist.
      <a href="PLAYSTORE_LINK" class="btn ghost" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 3 21 12 3 21 3 3"/></svg>
        Im Google Play Store laden
      </a>
      -->

    </div>
  </div>

  <footer>
    <a href="https://pflegelearn-nrw.vercel.app/impressum.html">Impressum</a>
    &nbsp;&middot;&nbsp;
    <a href="https://pflegelearn-nrw.vercel.app/datenschutz.html">Datenschutz</a>
  </footer>

</body>
</html>
