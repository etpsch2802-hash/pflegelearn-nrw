name: ci
# Qualitaetssicherung vor Deploy: Syntax-Check aller JS-Dateien + E2E-Tests.
# Bewusst leichtgewichtig gehalten – passt zur "kein Build"-Architektur (siehe CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: node --check (JS-Syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-Check aller JS-Dateien
        run: |
          set -e
          for f in api/*.js scripts/*.mjs chat.js tests/*.js; do
            if [ -f "$f" ]; then node --check "$f" && echo "OK: $f"; fi
          done
      - name: Syntax-Check aller Inline-Scripts in index.html
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          s = open('index.html', encoding='utf-8').read()
          bad = n = 0
          for attrs, body in re.findall(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>', s, flags=re.S):
              if 'json' in attrs or 'module' in attrs or not body.strip():
                  continue
              n += 1
              open('/tmp/inline.js', 'w', encoding='utf-8').write(body)
              r = subprocess.run(['node', '--check', '/tmp/inline.js'], capture_output=True, text=True)
              if r.returncode:
                  bad += 1
                  print('FEHLER in Inline-Script', n, r.stderr[:400])
          print(f'{n} Inline-Scripts geprueft, {bad} fehlerhaft')
          sys.exit(1 if bad else 0)
          PY

  e2e:
    name: E2E (Playwright, Backend gemockt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright + supabase-js installieren
        run: |
          npm i --no-save playwright @supabase/supabase-js@2
          npx playwright install --with-deps chromium
      - name: App lokal servieren und Tests ausfuehren
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8099/index.html; then break; fi
            sleep 0.5
          done
          code=0
          for t in tests/trial-e2e.js tests/app-e2e.js; do
            if [ -f "$t" ]; then
              echo "::group::$t"
              BASE_URL=http://127.0.0.1:8099 node "$t" || code=1
              echo "::endgroup::"
            fi
          done
          kill $SRV 2>/dev/null || true
          exit $code
